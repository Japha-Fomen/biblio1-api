spring:
  application:
    name: biblio1-api

  profiles:
    active: "test"

  flyway:
    locations: classpath:db/migration/{vendor}

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

biblio1:
  emprunt:
    maxiSimultanes: 2
    DureeJours: 30

  enregistrementLivre:
    nombreExemplaire: 1

  penalite:
    etudiant: 1.0
    standard: 2.0

server:
  port: 8091
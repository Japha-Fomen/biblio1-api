spring:
  flyway:
    locations: classpath:db/migration/{vendor}
  application:
    name: biblio1-api
  profiles:
    active: "test"


  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    server:
      port: 0

    biblio1:
      emprunt:
        maxiSimultanes: 2
        DureeJours: 30

      enregistrementLivre:
        nombreExemplaire: 1

      penalite:
        etudiant: 1.0
        standard: 2.0

    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
server:
  port: 8091
